# Nixpacks Configuration for Next.js + Prisma + MySQL
[phases.setup]
nixPkgs = ["nodejs_20", "openssl"]

[phases.install]
cmds = [
  "npm ci"
]

[phases.build]
cmds = [
  "npm run build",
  "cp -r .next/static .next/standalone/.next/static",
  "cp -r public .next/standalone/public"
]
envs = [
  "DATABASE_URL=mysql://build:build@localhost:3306/build_db",
  "JWT_SECRET=build-time-placeholder-32-chars-min"
]

[start]
cmd = "cp -r .next/static .next/standalone/.next/static && cp -r public .next/standalone/public && npx pm2-runtime start ecosystem.reminders.config.cjs"

[variables]
NIXPACKS_PATH = "/opt/nixpacks"
